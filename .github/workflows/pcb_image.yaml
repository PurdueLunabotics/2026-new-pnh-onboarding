name: pcb_image

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. DYNAMICALLY FIND ALL PROJECTS
  # ==========================================
  discover-projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Find KiCad Projects
        id: set-matrix
        run: |
          # Finds all .kicad_pcb files in the repo and outputs them as a JSON array
          PROJECTS=$(find . -type f -name "*.kicad_pcb" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$PROJECTS" >> $GITHUB_OUTPUT

  # ==========================================
  # 2. RUN CHECKS & RENDERS FOR EACH
  # ==========================================
  render-projects:
    needs: discover-projects
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        pcb_path: ${{ fromJson(needs.discover-projects.outputs.matrix) }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Project Variables
        id: vars
        run: |
          DIRNAME=$(dirname "${{ matrix.pcb_path }}")
          BASENAME=$(basename "${{ matrix.pcb_path }}" .kicad_pcb)
          echo "dir=$DIRNAME" >> $GITHUB_OUTPUT
          echo "name=$BASENAME" >> $GITHUB_OUTPUT

      - name: KiCad library setup
        run: |
          mkdir -p ~/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table ~/.config/kicad/10.0/sym-lib-table
          cp /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/fp-lib-table

      - name: Create output directory
        run: |
          # Everything for this project goes into outputs/{foldername}
          mkdir -p "outputs/${{ steps.vars.outputs.name }}"

      - name: Run ERC & Export Schematic
        run: |
          SCH_FILE="${{ steps.vars.outputs.dir }}/${{ steps.vars.outputs.name }}.kicad_sch"
          if [ -f "$SCH_FILE" ]; then
            kicad-cli sch erc --output "outputs/${{ steps.vars.outputs.name }}/erc.rpt" "$SCH_FILE"
            kicad-cli sch export svg --output "outputs/${{ steps.vars.outputs.name }}/" "$SCH_FILE"
          fi

      - name: Run DRC (Errors Only)
        run: |
          kicad-cli pcb drc --output "outputs/${{ steps.vars.outputs.name }}/drc.rpt" --severity-error "${{ matrix.pcb_path }}"

      - name: Export PCB Image
        run: |
          kicad-cli pcb export svg --layers F.Cu,B.Cu --output "outputs/${{ steps.vars.outputs.name }}/pcb.svg" --check-zones --mode-single --fit-page-to-board "${{ matrix.pcb_path }}"

      - name: Render PCB Image
        uses: linalinn/kicad-render@main
        with:
          pcb_file: ${{ matrix.pcb_path }}
          output_path: ${{ github.workspace }}/outputs/${{ steps.vars.outputs.name }}
          background: transparent

      - name: Upload Project Artifact
        uses: actions/upload-artifact@v4
        with:
          # Name the artifact exactly as the project name
          name: ${{ steps.vars.outputs.name }}
          path: outputs/${{ steps.vars.outputs.name }}
          retention-days: 1

  # ==========================================
  # 3. AGGREGATE, PUSH TO BRANCH, AND COMMENT
  # ==========================================
  publish-and-comment:
    needs: [discover-projects, render-projects]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Download all project artifacts
        uses: actions/download-artifact@v4
        with:
          # This automatically downloads every uploaded artifact into its own folder 
          # named after the artifact (which we set to the project name above).
          # Result: outputs/project1/..., outputs/project2/...
          path: outputs

      - name: Publish Renders to Asset Branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: pr-${{ github.event.pull_request.number }}-assets
          FOLDER: outputs 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Auto-generated PCB renders and reports"

      - name: Combine Reports and Images into Markdown
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/blob/pr-${{ github.event.pull_request.number }}-assets"
          CACHE_BUSTER="?raw=true&v=${{ github.run_id }}"
          
          echo "## 📊 PCB Validation Reports & Renders" > pr-message.md
          
          # Loop through each dynamically created folder in the outputs directory
          for proj_dir in outputs/*/; do
            [ -d "$proj_dir" ] || continue
            proj=$(basename "$proj_dir")
            
            echo "### 🚀 Project: $proj" >> pr-message.md
            echo "#### 📸 Renders" >> pr-message.md
            
            # Note: The images are now directly in the project folder
            echo "![Top Layer]($BASE_URL/$proj/top.png$CACHE_BUSTER)" >> pr-message.md
            echo "![Bottom Layer]($BASE_URL/$proj/bottom.png$CACHE_BUSTER)" >> pr-message.md
            
            if [ -f "outputs/$proj/${proj}.svg" ]; then
                echo "![Schematic]($BASE_URL/$proj/${proj}.svg$CACHE_BUSTER)" >> pr-message.md
            fi
            
            echo "---" >> pr-message.md
            
            # Read reports directly from the single folder
            echo "<details><summary><b>Click to expand $proj DRC Report</b></summary>" >> pr-message.md
            echo "" >> pr-message.md
            echo '```text' >> pr-message.md
            cat "outputs/$proj/drc.rpt" >> pr-message.md
            echo '```' >> pr-message.md
            echo "</details>" >> pr-message.md
            
            if [ -f "outputs/$proj/erc.rpt" ]; then
              echo "<details><summary><b>Click to expand $proj ERC Report</b></summary>" >> pr-message.md
              echo "" >> pr-message.md
              echo '```text' >> pr-message.md
              cat "outputs/$proj/erc.rpt" >> pr-message.md
              echo '```' >> pr-message.md
              echo "</details>" >> pr-message.md
            fi
            
            echo "<br>" >> pr-message.md
          done

      - name: Create or Update PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pcb-reports
          path: pr-message.md